# DB は Render の無料 PostgreSQL（作成から30日で失効）をやめ、Supabase を使う。
# このためこのファイルには databases を定義しない。DATABASE_URL は Render の
# ダッシュボードで手動設定する（docs/deploy.md 参照）。
services:
  - type: web
    name: seasonhub-web
    runtime: python
    plan: free
    region: singapore
    buildCommand: "pip install -r requirements.txt && python manage.py collectstatic --noinput && python manage.py migrate"
    startCommand: "gunicorn config.wsgi:application"
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.4
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        value: .onrender.com
      - key: DATABASE_URL
        sync: false
