{% load static %}
<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Home - Inby</title>
    <!-- 共通CSSの読み込み -->
    <link rel="stylesheet" href="{% static 'css/common.css' %}">
    <!-- homeページ専用の追加CSS -->
    <link rel="stylesheet" href="{% static 'css/home.css' %}">
</head>
<body>

    <!-- ヘッダー -->
    <header>
        <div class="header-title">ホーム</div>
    </header>

    <!--サイドバー表示用のトリガー 兼 浮遊アイコン -->
    <div id="sidebar-trigger" class="sidebar-trigger">
        <svg viewBox="0 0 24 24"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg>
        <svg viewBox="0 0 24 24"><path d="M4 4h16v2H4zm0 6h16v2H4zm0 6h16v2H4z"/></svg>
        <svg viewBox="0 0 24 24"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg>
    </div>
    <!-- サイドバー -->
    <aside id="sidebar" class="sidebar">
        <ul class="menu">
            <li>
                <!-- urls.py の name="home" と一致させる -->
                <a href="{% url 'home' %}" class="sidebar-link">
                    <svg viewBox="0 0 24 24"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg>
                    home
                </a>
            </li>
            <li>
                <!-- urls.py の name="new_event" と一致させる -->
                <a href="{% url 'new_event' %}" class="sidebar-link">
                    <svg viewBox="0 0 24 24"><path d="M4 4h16v2H4zm0 6h16v2H4zm0 6h16v2H4z"/></svg>
                    create
                </a>
            </li>
            <li>
                <!-- urls.py の name="my_events_list" と一致させる -->
                <a href="{% url 'my_events_list' %}" class="sidebar-link">
                    <svg viewBox="0 0 24 24"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg>
                    my card
                </a>
            </li>
        </ul>
    </aside>

    <!-- メインコンテンツ -->
    <div class="main-content home-content">
        <h1 class="brand-title">Inby</h1>
        <p class="catchphrase">季節イベントに誘ってデコる</p>
        
        <!-- 指定の「作成する」ボタン（別ページへのリンク） -->
        <a href="{% url 'new_event' %}" class="cta-button">
            作成する
        </a>
    </div>

    <!-- 共通JSの読み込み -->
    <script src="{% static 'js/script.js' %}"></script>
</body>
</html>
