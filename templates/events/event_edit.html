{% load static %}
<!DOCTYPE html>
<html lang="ja">
  <head>
      <meta charset="UTF-8">
      <meta name="viewport" content="width=device-width, initial-scale=1.0">
      <title>編集 - Inby</title>
      <link rel="stylesheet" href="{% static 'css/common.css' %}">
  </head>
  <body>
      {% csrf_token %}

      <!-- ヘッダー -->
      <header>
          <div class="header-title">edit_event.html</div>
      </header>

      <!-- サイドバー表示用のトリガー -->
      <div id="sidebar-trigger" class="sidebar-trigger"></div>

      <!-- サイドバー本体 -->
      <aside id="sidebar" class="sidebar">
          <ul class="menu">
              <li>
                  <svg viewBox="0 0 24 24">
                      <path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/>
                  </svg>
                  home
              </li>
              <li>
                  <svg viewBox="0 0 24 24">
                      <path d="M4 4h16v2H4zm0 6h16v2H4zm0 6h16v2H4z"/>
                  </svg>
                  create
              </li>
              <li>
                  <svg viewBox="0 0 24 24">
                      <path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/>
                  </svg>
                  my card
              </li>
          </ul>
      </aside>

      <!-- メインコンテンツ -->
      <div class="main-content">
          <div class="card-container">

              <button class="btn-complete" id="btn-complete" disabled>
                  完了
              </button>

              <div class="card-content">

                  <!-- 左側 -->
                  <div class="text-section">

                      <!-- タイトル：編集可能 -->
                      <div class="input-group">
                          <input
                              type="text"
                              id="input-title"
                              class="input-title"
                              placeholder="タイトル"
                              required
                          >
                          <p
                              class="error-msg"
                              id="error-title"
                              style="color: red; font-size: 12px; margin: 0; display: none;"
                          ></p>
                      </div>

                      <!-- 日付：編集可能 -->
                      <div class="input-group">
                          <input
                              type="date"
                              id="input-date"
                              class="input-date"
                              required
                          >
                          <p
                              class="error-msg"
                              id="error-date"
                              style="color: red; font-size: 12px; margin: 0; display: none;"
                          ></p>
                      </div>

                      <!-- 時間：表示のみ -->
                      <div class="input-group">
                          <input
                              type="text"
                              id="input-time"
                              class="input-time"
                              placeholder="時間"
                              readonly
                          >
                      </div>

                      <!-- 場所：編集可能 -->
                      <div class="input-group">
                          <input
                              type="text"
                              id="input-location"
                              class="input-location"
                              placeholder="場所"
                              required
                          >
                          <p
                              class="error-msg"
                              id="error-location"
                              style="color: red; font-size: 12px; margin: 0; display: none;"
                          ></p>
                      </div>

                      <!-- 投稿者：編集可能 -->
                      <div class="input-group">
                          <input
                              type="text"
                              id="input-author"
                              class="input-author"
                              placeholder="投稿者"
                              required
                          >
                          <p
                              class="error-msg"
                              id="error-author"
                              style="color: red; font-size: 12px; margin: 0; display: none;"
                          ></p>
                      </div>

                      <!-- メンバー：表示のみ -->
                      <div class="members-area">
                          <span>メンバー</span>
                          <p class="input-members" id="input-members">
                              名前
                          </p>
                      </div>

                  </div>

                  <!-- 右側の画像エリア -->
                  <div class="image-section">
                      <svg viewBox="0 0 24 24">
                          <path d="M19,3H5C3.89,3 3,3.9 3,5V19A2,2 0,0,0 5,21H19A2,2 0,0,0 21,19V5C21,3.89 20.1,3 19,3M19,19H5V5H19V19M13.96,12.29L11.21,15.83L9.25,13.47L6.5,17H17.5L13.96,12.29Z" />
                      </svg>
                  </div>

              </div>
          </div>
      </div>

      <script src="{% static 'js/script.js' %}"></script>

      <script>
          document.addEventListener("DOMContentLoaded", () => {
              const publicId = "{{ public_id }}";
              // 編集トークンはURLのクエリで受け取り、保存時はX-Edit-Tokenヘッダで送る
              // （URLに載せたまま送らないため）
              const editToken = new URLSearchParams(window.location.search).get("edit_token");

              const btnComplete = document.getElementById("btn-complete");

              const inputTitle = document.getElementById("input-title");
              const inputDate = document.getElementById("input-date");
              const inputTime = document.getElementById("input-time");
              const inputLocation = document.getElementById("input-location");
              const inputAuthor = document.getElementById("input-author");
              const inputMembers = document.getElementById("input-members");

              const editableInputs = [
                  inputTitle,
                  inputDate,
                  inputLocation,
                  inputAuthor
              ];

              // 今日より前の日付を選択できないようにする
              const today = new Date().toISOString().split("T")[0];
              inputDate.setAttribute("min", today);


              // CSRFトークン取得
              function getCookie(name) {
                  let cookieValue = null;

                  if (document.cookie && document.cookie !== "") {
                      const cookies = document.cookie.split(";");

                      for (let cookie of cookies) {
                          cookie = cookie.trim();

                          if (cookie.substring(0, name.length + 1) === name + "=") {
                              cookieValue = decodeURIComponent(
                                  cookie.substring(name.length + 1)
                              );
                              break;
                          }
                      }
                  }

                  return cookieValue;
              }


              // エラーを消す
              function clearErrors() {
                  document.querySelectorAll(".error-msg").forEach((element) => {
                      element.textContent = "";
                      element.style.display = "none";
                  });
              }


              // エラーを表示
              function showError(message) {
                  let targetId = "error-title";

                  if (message === "日付が不正です") {
                      targetId = "error-date";
                  } else if (message === "投稿者名を入力してください") {
                      targetId = "error-author";
                  } else if (message === "必須項目を入力してください") {
                      targetId = "error-title";
                  }

                  const target = document.getElementById(targetId);

                  target.textContent = message;
                  target.style.display = "block";
              }


              // フォームの入力状態を確認
              function validateForm() {
                  const isAllFilled = editableInputs.every(
                      (input) => input.value.trim() !== ""
                  );

                  btnComplete.disabled = !isAllFilled;
              }


              // 編集可能な入力欄が変更されたらチェック
              editableInputs.forEach((input) => {
                  input.addEventListener("input", validateForm);
                  input.addEventListener("change", validateForm);
              });


              // イベント情報を取得
              async function loadEvent() {
                  try {
                      const response = await fetch(
                          `/api/events/${publicId}`,
                          {
                              method: "GET",
                              headers: {
                                  "X-CSRFToken": getCookie("csrftoken")
                              }
                          }
                      );

                      if (!response.ok) {
                          throw new Error("イベント情報の取得に失敗しました");
                      }

                      const data = await response.json();

                      // 編集可能な項目
                      inputTitle.value = data.title;
                      inputDate.value = data.event_date;
                      inputLocation.value = data.location;
                      inputAuthor.value = data.organizer_name;

                      // 表示のみの項目
                      // 現在のAPIには時間がないため空欄のまま
                      inputTime.value = "";

                      // メンバー
                      if (data.participants && data.participants.length > 0) {
                          inputMembers.textContent = data.participants
                              .map((participant) => participant.name)
                              .join("、");
                      } else {
                          inputMembers.textContent = "名前";
                      }

                      validateForm();

                  } catch (error) {
                      console.error("API Error:", error);
                      showError("イベント情報の取得に失敗しました。");
                  }
              }


              // 完了ボタン
              btnComplete.addEventListener("click", async () => {
                  clearErrors();

                  const payload = {
                      title: inputTitle.value.trim(),
                      event_date: inputDate.value,
                      location: inputLocation.value.trim(),
                      organizer_name: inputAuthor.value.trim()
                  };

                  try {
                      btnComplete.disabled = true;

                      const headers = {
                          "Content-Type": "application/json",
                          "X-CSRFToken": getCookie("csrftoken")
                      };

                      if (editToken) {
                          headers["X-Edit-Token"] = editToken;
                      }

                      const response = await fetch(
                          `/api/events/${publicId}`,
                          {
                              method: "PATCH",
                              headers: headers,
                              body: JSON.stringify(payload)
                          }
                      );

                      if (response.ok) {
                          window.location.href = `/e/${publicId}/`;
                          return;
                      }

                      const errorData = await response.json();

                      if (errorData.error) {
                          showError(errorData.error);
                      }

                      validateForm();

                  } catch (error) {
                      console.error("API Error:", error);
                      showError("通信エラーが発生しました。");
                      validateForm();
                  }
              });


              // ページ読み込み時にイベント情報を取得
              loadEvent();
          });
      </script>
  </body>
</html>
