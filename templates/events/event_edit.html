{% load static %}
<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>編集 - Inby</title>
    <link rel="stylesheet" href="{% static 'css/common.css' %}">
</head>

<body data-public-id="{{ public_id }}">
    {% csrf_token %}

    <!-- ヘッダー -->
    <header>
        <div class="header-title">イベント情報更新</div>
    </header>

    <!-- サイドバー表示用のトリガー -->
    <div id="sidebar-trigger" class="sidebar-trigger">
        <svg viewBox="0 0 24 24"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg>
        <svg viewBox="0 0 24 24"><path d="M4 4h16v2H4zm0 6h16v2H4zm0 6h16v2H4z"/></svg>
        <svg viewBox="0 0 24 24"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg>
    </div>
    
    <!-- サイドバー本体 -->
    <aside id="sidebar" class="sidebar">
        <ul class="menu">
            <li>
                <svg viewBox="0 0 24 24">
                    <path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z" />
                </svg>
                home
            </li>
            <li>
                <svg viewBox="0 0 24 24">
                    <path d="M4 4h16v2H4zm0 6h16v2H4zm0 6h16v2H4z" />
                </svg>
                create
            </li>
            <li>
                <svg viewBox="0 0 24 24">
                    <path
                        d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z" />
                </svg>
                my card
            </li>
        </ul>
    </aside>

    <!-- メインコンテンツ -->
    <div class="main-content">
        <div class="card-container">

            <button class="btn-complete" id="btn-complete" disabled>
                完了
            </button>

            <div class="card-content">

                <!-- 左側 -->
                <div class="text-section">

                    <!-- タイトル：編集可能 -->
                    <div class="input-group">
                        <input type="text" id="input-title" class="input-title" placeholder="タイトル" required>
                        <p class="error-msg" id="error-title"
                            style="color: red; font-size: 12px; margin: 0; display: none;"></p>
                    </div>

                    <!-- 日付：編集可能 -->
                    <div class="input-group">
                        <input type="date" id="input-date" class="input-date" required>
                        <p class="error-msg" id="error-date"
                            style="color: red; font-size: 12px; margin: 0; display: none;"></p>
                    </div>

                    <!-- 時間：編集可能（任意項目） -->
                    <div class="input-group">
                        <input type="time" id="input-time" class="input-time">
                        <p class="error-msg" id="error-time"
                            style="color: red; font-size: 12px; margin: 0; display: none;"></p>
                    </div>

                    <!-- 場所：編集可能 -->
                    <div class="input-group">
                        <input type="text" id="input-location" class="input-location" placeholder="場所" required>
                        <p class="error-msg" id="error-location"
                            style="color: red; font-size: 12px; margin: 0; display: none;"></p>
                    </div>

                    <!-- 投稿者：編集可能 -->
                    <div class="input-group">
                        <input type="text" id="input-author" class="input-author" placeholder="投稿者" required>
                        <p class="error-msg" id="error-author"
                            style="color: red; font-size: 12px; margin: 0; display: none;"></p>
                    </div>

                    <!-- メンバー：表示のみ -->
                    <div class="members-area">
                        <span>メンバー</span>
                        <p class="input-members" id="input-members">
                            名前
                        </p>
                    </div>

                </div>

                <!-- 右側の画像エリア（縦積みにして、エラー表示時もcard-contentの横並びを崩さない） -->
                <div class="image-upload">
                    <div class="image-section" id="image-section">
                        <svg id="image-placeholder-icon" viewBox="0 0 24 24">
                            <path
                                d="M19,3H5C3.89,3 3,3.9 3,5V19A2,2 0,0,0 5,21H19A2,2 0,0,0 21,19V5C21,3.89 20.1,3 19,3M19,19H5V5H19V19M13.96,12.29L11.21,15.83L9.25,13.47L6.5,17H17.5L13.96,12.29Z" />
                        </svg>
                        <img id="image-preview" alt="選択した画像のプレビュー" style="display: none;">
                        <!-- 受け付ける画像形式はevents/views_api.pyのPHOTO_DATA_URL_PREFIXESと合わせる -->
                        <input type="file" id="input-image" accept="image/jpeg,image/png,image/webp" style="display: none;">
                    </div>
                    <button type="button" id="btn-remove-image" class="btn-remove-image" style="display: none;">画像を削除</button>
                    <p class="error-msg" id="error-image"
                        style="color: red; font-size: 12px; margin: 0; display: none;"></p>
                </div>

            </div>
        </div>
    </div>

    <script src="{% static 'js/script.js' %}"></script>
    <script src="{% static 'js/event_edit.js' %}"></script>
</body>

</html>
