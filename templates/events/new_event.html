{% extends "base.html" %}
{% load static %}

{% block title %}誘いを作成 - Inby{% endblock %}

{% block body %}
    <!-- docs/設計.md「CSRFの扱い」: JSはdocument.cookieのcsrftokenを読み、
         X-CSRFTokenヘッダに付けてfetchする。このタグでCookieを発行する -->
    {% csrf_token %}

    <!-- ヘッダー -->
    <header>
        <button type="button" id="hamburger-btn" class="hamburger-btn" aria-label="メニューを開く">
            <svg viewBox="0 0 24 24"><path d="M4 4h16v2H4zm0 6h16v2H4zm0 6h16v2H4z"/></svg>
        </button>
        <div class="header-title">招待カードを作成</div>
    </header>

    <!-- サイドバー表示用のトリガー -->
    <div id="sidebar-trigger" class="sidebar-trigger">
        <svg viewBox="0 0 24 24"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg>
        <svg viewBox="0 0 24 24"><path d="M4 4h16v2H4zm0 6h16v2H4zm0 6h16v2H4z"/></svg>
        <svg viewBox="0 0 24 24"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg>
    </div>

    <!-- サイドバー -->
    <aside id="sidebar" class="sidebar">
        <ul class="menu">
            <li>
                <!-- urls.py の name="home" と一致させる -->
                <a href="{% url 'home' %}" class="sidebar-link">
                    <svg viewBox="0 0 24 24"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg>
                    home
                </a>
            </li>
            <li>
                <!-- urls.py の name="new_event" と一致させる -->
                <a href="{% url 'new_event' %}" class="sidebar-link">
                    <svg viewBox="0 0 24 24"><path d="M4 4h16v2H4zm0 6h16v2H4zm0 6h16v2H4z"/></svg>
                    create
                </a>
            </li>
            <li>
                <!-- urls.py の name="my_events_list" と一致させる -->
                <a href="{% url 'my_events_list' %}" class="sidebar-link">
                    <svg viewBox="0 0 24 24"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg>
                    my card
                </a>
            </li>
        </ul>
    </aside>

    <!-- メインコンテンツ -->
    <div class="main-content">
        <div class="card-container">
            <!-- ボタンにidを付与し、初期状態はdisabled（無効化）にしておく -->
            <button class="btn-complete" id="btn-complete" disabled>作成</button>

            <div class="card-content">
                <!-- 左側のテキスト入力エリア -->
                <div class="text-section">
                    <div class="input-group">
                        <input type="text" id="input-title" class="input-title" placeholder="タイトル" required>
                        <p class="error-msg" id="error-title" style="color: red; font-size: 12px; margin: 0; display: none;"></p>
                    </div>

                    <div class="input-group">
                        <!-- type="date"化し、過去日不可はJS側でmin属性を設定します -->
                        <input type="date" id="input-date" class="input-date" placeholder="YYYY/MM/DD" required>
                        <p class="error-msg" id="error-date" style="color: red; font-size: 12px; margin: 0; display: none;"></p>
                    </div>

                    <div class="input-group">
                        <!-- 時間は任意項目（未入力の場合はpayloadに含めない） -->
                        <input type="time" id="input-time" class="input-time">
                        <p class="error-msg" id="error-time" style="color: red; font-size: 12px; margin: 0; display: none;"></p>
                    </div>

                    <div class="input-group">
                        <input type="text" id="input-location" class="input-location" placeholder="場所" required>
                        <p class="error-msg" id="error-location" style="color: red; font-size: 12px; margin: 0; display: none;"></p>
                    </div>

                    <div class="input-group">
                        <input type="text" id="input-author" class="input-author" placeholder="投稿者" required>
                        <p class="error-msg" id="error-author" style="color: red; font-size: 12px; margin: 0; display: none;"></p>
                    </div>

                    <!-- <div class="members-area">
                        <span>メンバー</span>
                        <p class="input-members">名前</p>
                    </div> -->
                </div>

                <!-- 右側の画像エリア（縦積みにして、エラー表示時もcard-contentの横並びを崩さない） -->
                <div class="image-upload">
                    <div class="image-section" id="image-section">
                        <svg id="image-placeholder-icon" viewBox="0 0 24 24">
                            <path d="M19,3H5C3.89,3 3,3.9 3,5V19A2,2 0 0,0 5,21H19A2,2 0 0,0 21,19V5C21,3.89 20.1,3 19,3M19,19H5V5H19V19M13.96,12.29L11.21,15.83L9.25,13.47L6.5,17H17.5L13.96,12.29Z" />
                        </svg>
                        <img id="image-preview" alt="選択した画像のプレビュー" style="display: none;">
                        <!-- 受け付ける画像形式はevents/views_api.pyのPHOTO_DATA_URL_PREFIXESと合わせる -->
                        <input type="file" id="input-image" accept="image/jpeg,image/png,image/webp" style="display: none;">
                    </div>
                    <p class="error-msg" id="error-image" style="color: red; font-size: 12px; margin: 0; display: none;"></p>
                </div>
            </div>
        </div>
    </div>

    <!-- JSファイルの読み込み -->
    <!-- 既存のscript.js（サイドバー共通ロジック） -->
    <script src="{% static 'js/script.js' %}"></script>
    <!-- 新規作成するフォーム用ロジック -->
    <script src="{% static 'js/new_event.js' %}"></script>
{% endblock %}
