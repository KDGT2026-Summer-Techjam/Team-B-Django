{% load static %}
<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>誘いを作成 - SeasonHub（仮）</title>
    <!-- common.cssを読み込む -->
    <link rel="stylesheet" href="{% static 'css/common.css' %}">
</head>
<body>

    <!-- ヘッダー -->
    <header>
        <div class="header-title">new_event.html</div>
    </header>

    <!-- サイドバー表示用のトリガー（画面左端） -->
    <div id="sidebar-trigger" class="sidebar-trigger"></div>

    <!-- サイドバー本体 -->
    <aside id="sidebar" class="sidebar">
        <ul class="menu">
            <li>
                <svg viewBox="0 0 24 24"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg>
                home
            </li>
            <li>
                <svg viewBox="0 0 24 24"><path d="M4 4h16v2H4zm0 6h16v2H4zm0 6h16v2H4z"/></svg>
                create
            </li>
            <li>
                <svg viewBox="0 0 24 24"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg>
                my card
            </li>
        </ul>
    </aside>

    <!-- メインコンテンツ -->
    <div class="main-content">
        <div class="card-container">
            <button class="btn-complete">完了</button>
            
            <div class="card-content">
                <!-- 左側のテキスト入力エリア -->
                <div class="text-section">
                    <input type="text" class="input-title" placeholder="タイトル">
                    
                    <input type="text" class="input-date" placeholder="YYYY/MM/DD">
                    <input type="text" class="input-time" placeholder="時間">
                    <input type="text" class="input-location" placeholder="場所">
                    <input type="text" class="input-author" placeholder="投稿者">

                    <div class="members-area">
                        <span>メンバー</span>
                        <p class="input-members">名前</p>
                    </div>
                </div>

                <!-- 右側の画像エリア -->
                <div class="image-section">
                    <svg viewBox="0 0 24 24">
                        <path d="M19,3H5C3.89,3 3,3.9 3,5V19A2,2 0 0,0 5,21H19A2,2 0 0,0 21,19V5C21,3.89 20.1,3 19,3M19,19H5V5H19V19M13.96,12.29L11.21,15.83L9.25,13.47L6.5,17H17.5L13.96,12.29Z" />
                    </svg>
                </div>
            </div>
        </div>
    </div>

    <!-- JSファイルの読み込み -->
    <script src="{% static 'js/script.js' %}"></script>
</body>
</html>
