{% load static %}
<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>投稿完了 - Inby</title>
    <!-- 共通CSSの読み込み -->
    <link rel="stylesheet" href="{% static 'css/common.css' %}">
    <!-- このページ専用の追加CSS -->
    <link rel="stylesheet" href="{% static 'css/event_done.css' %}">
</head>
<!-- views.pyから渡される public_id のみをJSへ渡すための器として残します -->
<body data-public-id="{{ public_id }}">

    <!-- ヘッダー -->
    <header>
        <div class="header-title">post</div>
    </header>

    <!-- サイドバー表示用のトリガー -->
    <div id="sidebar-trigger" class="sidebar-trigger"></div>

    <!-- サイドバー -->
    <aside id="sidebar" class="sidebar">
        <ul class="menu">
            <li>
                <!-- urls.py の name="home" と一致させる -->
                <a href="{% url 'home' %}" class="sidebar-link">
                    <svg viewBox="0 0 24 24"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg>
                    home
                </a>
            </li>
            <li>
                <!-- urls.py の name="new_event" と一致させる -->
                <a href="{% url 'new_event' %}" class="sidebar-link">
                    <svg viewBox="0 0 24 24"><path d="M4 4h16v2H4zm0 6h16v2H4zm0 6h16v2H4z"/></svg>
                    create
                </a>
            </li>
            <li>
                <!-- urls.py の name="my_events_list" と一致させる -->
                <a href="{% url 'my_events_list' %}" class="sidebar-link">
                    <svg viewBox="0 0 24 24"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg>
                    my card
                </a>
            </li>
        </ul>
    </aside>
    
    <!-- メインコンテンツ -->
    <div class="main-content done-page-layout">
        <h1 class="done-title">カードが投稿されました！</h1>
        <p class="done-subtitle">シェアして友達を誘おう</p>

        <div class="preview-wrapper">
            <!-- 縮小表示用の枠 -->
            <div class="preview-scale-box">
                
                <div class="card-container preview-card">
                    <!-- プレビューでは完了ボタンを非表示 -->
                    <button class="btn-complete" style="display: none;">完了</button>
                    
                    <div class="card-content">
                        <div class="text-section">
                            <!-- JSでデータを挿入するための id を付与し、中身を空（またはデフォルト値）にします -->
                            <div class="input-title" id="done-title"></div>
                            <div class="input-date" id="done-date"></div>
                            <div class="input-time" id="done-time">時間未定</div>
                            <div class="input-location" id="done-location"></div>
                            <div class="input-author" id="done-author"></div>
                        
                            <div class="members-area">
                                <span>メンバー</span>
                                <!-- メンバー一覧もJSで組み立てます -->
                                <div class="input-members" id="done-members">
                                    読み込み中...
                                </div>
                            </div>
                        </div>
                        <div class="image-section">
                            <svg viewBox="0 0 24 24">
                                <path d="M19,3H5C3.89,3 3,3.9 3,5V19A2,2 0 0,0 5,21H19A2,2 0 0,0 21,19V5C21,3.89 20.1,3 19,3M19,19H5V5H19V19M13.96,12.29L11.21,15.83L9.25,13.47L6.5,17H17.5L13.96,12.29Z" />
                            </svg>
                        </div>
                    </div>
                </div>
                
            </div>

            <!-- アクションアイコン -->
            <div class="action-icons">
                <button class="icon-btn" id="btn-copy" title="コピー">
                    <svg viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round">
                        <rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect>
                        <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>
                    </svg>
                </button>
                <button class="icon-btn" id="btn-share" title="シェア">
                    <svg viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round">
                        <circle cx="18" cy="5" r="3"></circle>
                        <circle cx="6" cy="12" r="3"></circle>
                        <circle cx="18" cy="19" r="3"></circle>
                        <line x1="8.59" y1="13.51" x2="15.42" y2="17.49"></line>
                        <line x1="15.41" y1="6.51" x2="8.59" y2="10.49"></line>
                    </svg>
                </button>
            </div>
        </div>
    </div>

    <!-- 戻るボタン -->
    <a href="{% url 'my_events_list' %}" class="btn-return">戻る</a>

    <!-- JSの読み込み -->
    <script src="{% static 'js/script.js' %}"></script>
    <!-- 追加: 完了画面専用のJSロジック -->
    <script src="{% static 'js/event_done.js' %}"></script>
</body>
</html>
