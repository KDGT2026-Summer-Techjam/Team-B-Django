{% load static %}
<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Card - Inby</title>
    <link rel="stylesheet" href="{% static 'css/common.css' %}">
    <!-- このページ専用の追加CSS -->
    <link rel="stylesheet" href="{% static 'css/my_event.css' %}">
</head>
<body>

    <!-- ヘッダー -->
    <header>
        <button type="button" id="hamburger-btn" class="hamburger-btn" aria-label="メニューを開く">
            <svg viewBox="0 0 24 24"><path d="M4 4h16v2H4zm0 6h16v2H4zm0 6h16v2H4z"/></svg>
        </button>
        <div class="header-title">マイカード</div>
    </header>

    <!-- サイドバー表示用のトリガー -->
    <div id="sidebar-trigger" class="sidebar-trigger">
      <svg viewBox="0 0 24 24"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg>
      <svg viewBox="0 0 24 24"><path d="M4 4h16v2H4zm0 6h16v2H4zm0 6h16v2H4z"/></svg>
      <svg viewBox="0 0 24 24"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg>
    </div>

    <!-- サイドバー -->
    <aside id="sidebar" class="sidebar">
        <ul class="menu">
            <li>
                <a href="{% url 'home' %}" class="sidebar-link">
                    <svg viewBox="0 0 24 24"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg>
                    home
                </a>
            </li>
            <li>
                <a href="{% url 'new_event' %}" class="sidebar-link">
                    <svg viewBox="0 0 24 24"><path d="M4 4h16v2H4zm0 6h16v2H4zm0 6h16v2H4z"/></svg>
                    create
                </a>
            </li>
            <li>
                <a href="{% url 'my_events_list' %}" class="sidebar-link">
                    <svg viewBox="0 0 24 24"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg>
                    my card
                </a>
            </li>
        </ul>
    </aside>
    
    <!-- メインコンテンツ -->
    <div class="main-content my-events-layout">
        <h1 class="page-title">My Card</h1>
        <p class="page-subtitle">保存されたカード一覧</p>

        <!-- 縦スクロール領域。ここにJSでカードを追加します -->
        <div class="events-scroll-area" id="events-container">
            <!-- 読み込み中、または空の時のメッセージ -->
            <p class="empty-message">読み込み中...</p>
        </div>
    </div>

    <script src="{% static 'js/script.js' %}"></script>
    <script src="{% static 'js/my_event.js' %}"></script>
</body>
</html>
