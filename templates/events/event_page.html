{% load static %}
<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="UTF-8">
  <title>誘いのページ - Inby</title>
  <link rel="stylesheet" href="{% static 'css/event_page.css' %}">
  <!-- <link rel="stylesheet" href="../../static/css/event_page.css"> -->

  <script src="{% static 'js/script.js' %}" defer></script>
  <script src="{% static 'js/event_page.js' %}" defer></script>
</head>

<body data-public-id="{{ public_id }}">
  <!-- docs/設計.md「CSRFの扱い」: JSはdocument.cookieのcsrftokenを読み、
  X-CSRFTokenヘッダに付けてfetchする。このタグでCookieを発行する -->
  {% csrf_token %}
  <!-- TODO: フロント担当。参加前／参加後の2状態をJSで切り替える -->

  <!-- サイドバー -->
  <div id="sidebar-trigger" class="sidebar-trigger"></div>

  <aside id="sidebar" class="sidebar">
    <ul class="menu">
      <li>
        <svg viewBox="0 0 24 24">
          <path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z" />
        </svg>
        home
      </li>
      <li>
        <svg viewBox="0 0 24 24">
          <path d="M4 4h16v2H4zm0 6h16v2H4zm0 6h16v2H4z" />
        </svg>
        create
      </li>
      <li>
        <svg viewBox="0 0 24 24">
          <path
            d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z" />
        </svg>
        my card
      </li>
    </ul>
  </aside>

  <!-- main -->
  <main>
    <div class="main-content">
      <div class="card-container">

        <div class="event-card">
          <div class="card-content">

            <!-- 左側のテキスト入力エリア -->
            <div class="text-section">
              <h1 id="event-title">タイトル</h1>
              <div class="event-details">
                <p id="event-date">YYYY/MM/DD</p>
                <p id="event-days-left">(予定日までの日にち)</p>
                <p id="event-time">hh:mm</p>
                <p id="event-location">場所</p>
                <p id="event-author">投稿者</p>
              </div>

              <div class="members-area">
                <div class="member-header">
                  <span>メンバー</span>

                  <!-- js で内容変更する -->
                  <span id="event-member-count">〇人</span>
                </div>

                <!-- js で内容変更する -->
                <ul class="input-members" id="event-member-list">
                  <li>名前</li>
                  <li>名前</li>
                </ul>

                <!-- js で画像を変更する？ -->
                <div class="visual-area">
                  <div class="image-placeholder"></div>
                </div>
              </div>
            </div>

            <!-- 右側の画像エリア -->
            <div class="image-section">
              <svg viewBox="0 0 24 24">
                <path
                  d="M19,3H5C3.89,3 3,3.9 3,5V19A2,2 0 0,0 5,21H19A2,2 0 0,0 21,19V5C21,3.89 20.1,3 19,3M19,19H5V5H19V19M13.96,12.29L11.21,15.83L9.25,13.47L6.5,17H17.5L13.96,12.29Z" />
              </svg>
            </div>
            <button class="btn-complete" id="event-join-btn">参加する</button>
          </div>
        </div>
      </div>
    </div>
  </main>
</body>

</html>
