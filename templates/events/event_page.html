{% load static %}
<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>誘いのページ - Inby</title>
  <link rel="stylesheet" href="{% static 'css/common.css' %}">
  <!-- キャッシュ回避のためのパラメータを付与 -->
  <link rel="stylesheet" href="{% static 'css/event_page.css' %}?v=9">

  <!-- 画像ダウンロード用のライブラリ -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

  <script src="{% static 'js/script.js' %}" defer></script>
  <script src="{% static 'js/event_page.js' %}" defer></script>
</head>
<body data-public-id="{{ public_id }}" data-is-participant="{{ is_participant|yesno:"true,false" }}">
  {% csrf_token %}

  <div id="sidebar-trigger" class="sidebar-trigger"></div>
  <aside id="sidebar" class="sidebar">
    <ul class="menu">
      <li><a href="{% url 'home' %}" class="sidebar-link"><svg viewBox="0 0 24 24"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z" /></svg>home</a></li>
      <li><a href="{% url 'new_event' %}" class="sidebar-link"><svg viewBox="0 0 24 24"><path d="M4 4h16v2H4zm0 6h16v2H4zm0 6h16v2H4z" /></svg>create</a></li>
      <li><a href="{% url 'my_events_list' %}" class="sidebar-link"><svg viewBox="0 0 24 24"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z" /></svg>my card</a></li>
    </ul>
  </aside>

  <main>
    <div class="main-content">
      <!-- DL時にこのコンテナ全体を画像化します -->
      <div class="event-page-container" id="capture-area">
        
        <!-- ================= 上部：イベント詳細 ================= -->
        <div class="event-header-card">
          <!-- タイトルは2カラムの外に出し、カード全体の幅を使って表示する -->
          <h1 id="event-title">タイトル</h1>
          <div class="header-inner">
            <!-- 左側：テキストエリア -->
            <div class="text-section">
              <div class="date-row">
                <p id="event-date">日時</p>
                <p id="event-days-left">残り日数</p>
              </div>
              <p id="event-time" hidden>時刻</p>
              
              <div class="info-group">
                <span class="info-label">場所</span>
                <p id="event-location">場所</p>
              </div>
              <div class="info-group">
                <span class="info-label">主催者</span>
                <p id="event-author">主催者</p>
              </div>

              <div class="members-area">
                <div class="member-header">
                  <span>参加メンバー</span>
                  <span id="event-member-count" class="member-count-small">0人</span>
                </div>
                <ul class="input-members" id="event-member-list">
                  <li>読み込み中...</li>
                </ul>
              </div>
            </div>

            <!-- 右側：画像＆参加エリア -->
            <div class="action-section">
              <!-- 編集は専用画面（開始時刻・画像にも対応）に集約する。作成者以外には編集ボタン自体を表示しない -->
              {% if is_creator %}
              <a class="btn-edit" href="{% url 'event_edit' public_id=public_id %}">編集</a>
              {% endif %}
              
              <div class="map-placeholder">
                <img id="event-image" alt="イベント画像" style="display: none;">
              </div>
              
              <div class="join-action-wrapper">
                <div class="join-area" id="event-join-area">
                  <input type="text" id="event-name-input" placeholder="名前" maxlength="255">
                  <button class="btn-complete" id="event-join-btn">参加する</button>
                </div>

                <button class="btn-cancel-join" id="event-cancel-join-btn" hidden>
                  参加を取り消す
                </button>

                <p class="error-msg" id="event-error" hidden></p>
              </div>
            </div>
          </div>
        </div>

        <!-- ================= 下部：スタンプラリー ================= -->
        <div class="stamp-rally-card">
          <div class="sr-header">
            <h2>STAMP RALLY</h2>
          </div>
          
          <!-- ミッション入力リスト -->
          <div class="missions-container">
            <div class="mission-row" data-mission="1">
              <span class="m-icon" id="m-icon-1">🔒</span>
              <span>ミッション 1</span>
              <input type="text" class="mission-input" readonly>
            </div>
            <div class="mission-row" data-mission="2">
              <span class="m-icon" id="m-icon-2">🔒</span>
              <span>ミッション 2</span>
              <input type="text" class="mission-input" readonly>
            </div>
            <div class="mission-row" data-mission="3">
              <span class="m-icon" id="m-icon-3">🔒</span>
              <span>ミッション 3</span>
              <input type="text" class="mission-input" readonly>
            </div>
          </div>

          <!-- スタンプマップエリア -->
          <div class="rally-map-container">
            <!-- 軌跡の線（背景用） -->
            <svg class="map-path-bg" viewBox="0 0 360 480">
              <path d="M 90 90 Q 220 120 270 240 Q 220 370 100 400" fill="transparent" stroke="#E2E8F0" stroke-width="6" stroke-dasharray="10 10" />
            </svg>
            <!-- 軌跡の線（アニメーション進行用） -->
            <svg class="map-path-active" viewBox="0 0 360 480">
              <path id="active-path" d="M 90 90 Q 220 120 270 240 Q 220 370 100 400" fill="transparent" stroke="#B2D235" stroke-width="6" stroke-dasharray="10 10" />
            </svg>

            <!-- Node 1 -->
            <div class="map-node node-1 locked" id="node-1">
              <div class="node-icon">🔒</div>
              <div class="node-num">1</div>
            </div>
            <div class="photo-box pb-1 hidden" id="photo-box-1">
              <input type="file" accept="image/*" class="file-input" id="file-1">
              <label for="file-1" class="photo-label">＋<br>写真1</label>
              <img src="" class="preview-img" id="preview-1">
            </div>

            <!-- Node 2 -->
            <div class="map-node node-2 hidden" id="node-2">
              <div class="node-icon">🔒</div>
              <div class="node-num">2</div>
            </div>
            <div class="photo-box pb-2 hidden" id="photo-box-2">
              <input type="file" accept="image/*" class="file-input" id="file-2">
              <label for="file-2" class="photo-label">＋<br>写真2</label>
              <img src="" class="preview-img" id="preview-2">
            </div>

            <!-- Node 3 -->
            <div class="map-node node-3 hidden" id="node-3">
              <div class="node-icon">🔒</div>
              <div class="node-num">3</div>
            </div>
            <div class="photo-box pb-3 hidden" id="photo-box-3">
              <input type="file" accept="image/*" class="file-input" id="file-3">
              <label for="file-3" class="photo-label">＋<br>写真3</label>
              <img src="" class="preview-img" id="preview-3">
            </div>
          </div>
        </div>

        <!-- ...スタンプマップエリア等の記述... -->

        <!-- アクションアイコン (DL時は非表示にする) -->
        <div class="card-footer-icons" id="footer-actions">
          <button class="icon-btn" id="btn-download" title="ダウンロード">
            <svg viewBox="0 0 24 24"><path d="M5 20h14v-2H5v2zM19 9h-4V3H9v6H5l7 7 7-7z"/></svg>
          </button>
          <button class="icon-btn" id="btn-copy" title="URLコピー">
            <svg viewBox="0 0 24 24"><path d="M16 1H4c-1.1 0-2 .9-2 2v14h2V3h12V1zm3 4H8c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h11c1.1 0 2-.9 2-2V7c0-1.1-.9-2-2-2zm0 16H8V7h11v14z"/></svg>
          </button>
        </div>

        <!-- ★追加1：透明な落書き用キャンバス（#capture-area の内側の一番下に配置） -->
        <canvas id="doodle-canvas" class="doodle-layer"></canvas>

      </div> <!-- /#capture-area の閉じタグ -->
    </div> <!-- /.main-content の閉じタグ -->

    <!-- ★追加2：落書きツールバー（DL画像に入らないよう #capture-area の外に配置） -->
    <div id="doodle-toolbar" class="doodle-toolbar">
      <button id="btn-toggle-doodle" class="doodle-btn">✏️ 落書きモード: OFF</button>
      
      <div id="doodle-controls" class="doodle-controls hidden">
        <!-- ツール切替（ペン／スタンプ）。スタンプはミッション3個クリアで解放 -->
        <div class="tool-mode-tabs">
          <button type="button" class="tool-mode-btn active" data-mode="pen">✏️ ペン</button>
          <button type="button" class="tool-mode-btn" data-mode="eraser">🧹 消しゴム</button>
          <button type="button" class="tool-mode-btn locked" data-mode="emoji" id="emoji-mode-btn" disabled>
            😀 スタンプ<span class="lock-badge">🔒</span>
          </button>
        </div>

        <!-- 色パレット：ミッション達成数に応じて段階的に解放される -->
        <div class="color-palette" id="color-palette">
          <div class="color-swatch active" data-color="#000000" data-tier="0" style="background: #000000;"></div>
          <div class="color-swatch" data-color="#ffffff" data-tier="0" style="background: #ffffff; border: 1px solid #ccc;"></div>
          <div class="color-swatch" data-color="#888888" data-tier="0" style="background: #888888;"></div>

          <div class="color-swatch locked" data-color="#E53935" data-tier="1" style="background: #E53935;"></div>
          <div class="color-swatch locked" data-color="#FB8C00" data-tier="1" style="background: #FB8C00;"></div>
          <div class="color-swatch locked" data-color="#FDD835" data-tier="1" style="background: #FDD835;"></div>

          <div class="color-swatch locked" data-color="#9CCC65" data-tier="2" style="background: #9CCC65;"></div>
          <div class="color-swatch locked" data-color="#43A047" data-tier="2" style="background: #43A047;"></div>
          <div class="color-swatch locked" data-color="#4FC3F7" data-tier="2" style="background: #4FC3F7;"></div>

          <div class="color-swatch locked" data-color="#1E88E5" data-tier="3" style="background: #1E88E5;"></div>
          <div class="color-swatch locked" data-color="#8E24AA" data-tier="3" style="background: #8E24AA;"></div>
          <div class="color-swatch locked" data-color="#EC407A" data-tier="3" style="background: #EC407A;"></div>
        </div>

        <!-- 絵文字スタンプパレット：ミッション3個クリアで表示される -->
        <div class="emoji-palette hidden" id="emoji-palette">
          <button type="button" class="emoji-swatch active" data-emoji="⭐">⭐</button>
          <button type="button" class="emoji-swatch" data-emoji="🎉">🎉</button>
          <button type="button" class="emoji-swatch" data-emoji="💖">💖</button>
          <button type="button" class="emoji-swatch" data-emoji="✨">✨</button>
          <button type="button" class="emoji-swatch" data-emoji="🍁">🍁</button>
          <button type="button" class="emoji-swatch" data-emoji="🎆">🎆</button>
          <button type="button" class="emoji-swatch" data-emoji="🌸">🌸</button>
          <button type="button" class="emoji-swatch" data-emoji="🍧">🍧</button>
        </div>

        <div class="weight-control">
          <span style="font-size: 10px;">太さ:</span>
          <input type="range" id="pen-weight" min="1" max="10" value="3">
        </div>
        <button id="btn-clear-doodle" class="doodle-btn clear-btn">全消し</button>
      </div>
    </div>
  </main>

</body>
</html>
